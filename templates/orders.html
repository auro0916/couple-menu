<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单列表</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            color: #333;
        }

        .page {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
        }

        .home-link {
            text-decoration: none;
            background: #ff6b6b;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .home-link:hover {
            background: #ff4f4f;
        }

        .empty-box {
            background: white;
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            color: #888;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .order-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .order-id {
            font-weight: bold;
            font-size: 18px;
        }

        .order-status {
            color: #ff9800;
            font-weight: bold;
        }

        .order-meta {
            color: #666;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .order-summary {
            border-top: 1px solid #eee;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-total {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 18px;
        }

        .detail-link {
            text-decoration: none;
            background: #28a745;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
        }

        .detail-link:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>订单列表</h1>
            <a class="home-link" href="/">返回点餐首页</a>
        </div>

        {% if orders %}
            {% for order in orders %}
                <div class="order-card">
                    <div class="order-top">
                        <div class="order-id">订单号：{{ order.order_id }}</div>
                        <div class="order-status">{{ order.status }}</div>
                    </div>

                    <div class="order-meta">
                        <div>下单时间：{{ order.created_at }}</div>
                        <div>商品数量：{{ order["items"] | length }}</div>
                    </div>

                    <div class="order-summary">
                        <div class="order-total">合计：{{ order.total }}</div>
                        <a class="detail-link" href="/order/{{ order.order_id }}">查看详情</a>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="empty-box">
                还没有订单，先去下第一单吧。
            </div>
        {% endif %}
    </div>
</body>
</html>
