<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单列表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/orders.css') }}">
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>订单列表</h1>
            <a class="home-link" href="/">返回点餐首页</a>
        </div>

        {% if orders %}
            {% for order in orders %}
                <div class="order-card">
                    <div class="order-top">
                        <div class="order-id">订单号：{{ order.order_id }}</div>
                        <div class="order-status">{{ order.status }}</div>
                    </div>

                    <div class="order-meta">
                        <div>下单时间：{{ order.created_at }}</div>
                        <div>商品数量：{{ order["items"] | length }}</div>
                    </div>

                    <div class="order-summary">
                        <div class="order-total">合计：{{ order.total }}</div>
                        <a class="detail-link" href="/order/{{ order.order_id }}">查看详情</a>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="empty-box">
                还没有订单，先去下第一单吧。
            </div>
        {% endif %}
    </div>
</body>
</html>
