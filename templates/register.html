<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 奶龙厨房</title>
    <link rel="shortcut icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <link rel="stylesheet" href="/static/assets/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url('/static/assets/images/hero-bg.png') !important;
            background-size: cover !important;
            background-position: top center !important;
            background-attachment: fixed !important;
        }
        main, article, .login-section { background: transparent !important; }
    </style>
</head>

<body>
    <header class="header" data-header>
        <div class="container">
            <a href="/" class="logo">
                <img src="/static/assets/images/logo.png" width="148" height="38" alt="Fasteat home">
            </a>
            <nav class="navbar" data-navbar>
                <button class="nav-close-btn" aria-label="close menu" data-nav-toggler>
                    <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
                </button>
                <a href="/" class="logo">
                    <img src="/static/assets/images/logo.png" width="148" height="38" alt="Fasteat home">
                </a>
                <ul class="navbar-list">
                    <li class="navbar-item">
                        <a href="/" class="navbar-link" data-nav-link>主页</a>
                    </li>
                    <li class="navbar-item">
                        <a href="/" class="navbar-link" data-nav-link>关于我们</a>
                    </li>
                </ul>
            </nav>
            <div class="header-action">
                <button class="cart-btn" aria-label="cart">
                    <ion-icon name="bag" aria-hidden="true"></ion-icon>
                </button>
                <a href="/" class="btn btn-primary has-after">返回首页</a>
            </div>
            <button class="nav-open-btn" aria-label="open menu" data-nav-toggler>
                <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
            </button>
            <div class="overlay" data-overlay data-nav-toggler></div>
        </div>
    </header>
    <main>
        <article>
            <section class="section login-section" aria-label="register">
                <div class="container login-container">
                    <div class="login-content" data-reveal="left">
                        <h1 class="h1 login-title">新用户注册</h1>
                        <p class="login-subtitle">创建一个新账户以开始订餐</p>

                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        <div class="flash-messages"
                            style="color: #ff4d4d; margin-bottom: 15px; font-size: 14px; background-color: #ffe6e6; padding: 10px; border-radius: 5px;">
                            {% for message in messages %}
                            <p>{{ message }}</p>
                            {% endfor %}
                        </div>
                        {% endif %}
                        {% endwith %}

                        <form class="login-form" method="POST" action="{{ url_for('register') }}" data-reveal>
                            <div class="form-group" data-reveal>
                                <label for="username_input" class="form-label">用户名</label>
                                <input type="text" id="username_input" name="username" class="form-input"
                                    placeholder="请设置用户名" required>
                            </div>

                            <div class="form-group" data-reveal>
                                <label for="password" class="form-label">密码</label>
                                <input type="password" id="password" name="password" class="form-input"
                                    placeholder="请设置密码" required>
                            </div>

                            <div class="form-group form-checkbox" data-reveal
                                style="visibility: hidden; pointer-events: none;">
                                <input type="checkbox" id="register_placeholder" class="checkbox-input">
                                <label for="register_placeholder" class="checkbox-label">占位对齐</label>
                            </div>

                            <button type="submit" class="btn btn-login has-after" data-reveal>立即注册</button>
                        </form>

                        <div class="login-footer" data-reveal>
                            <a href="#" class="forgot-link" style="visibility: hidden; pointer-events: none;">占位</a>
                            <div class="signup-link">
                                已有账户？<a href="{{ url_for('login') }}">立即登录</a>
                            </div>
                        </div>
                    </div>

                    <div class="login-image" data-reveal="right">
                        <img src="/static/assets/images/home-image.png" width="400" height="450" alt="register image"
                            class="w-100">
                    </div>
                </div>
            </section>
        </article>
    </main>

    <script src="/static/assets/js/script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
