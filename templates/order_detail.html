<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            color: #333;
        }

        .page {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back-link {
            text-decoration: none;
            background: #6c757d;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .back-link:hover {
            background: #5a6268;
        }

        .detail-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        .info-section {
            border-bottom: 1px solid #eee;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            font-weight: bold;
        }

        .status-highlight {
            color: #ff9800;
        }

        .items-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #eee;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
        }

        .item-meta {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .item-price-total {
            font-weight: bold;
            color: #333;
        }

        .summary-section {
            margin-top: 20px;
            text-align: right;
            font-size: 20px;
        }

        .total-price {
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="header">
            <h1>订单详情</h1>
            <a class="back-link" href="/orders">返回订单列表</a>
        </div>

        <div class="detail-card">
            <!-- 订单基本信息 -->
            <div class="info-section">
                <div class="info-row">
                    <span class="info-label">订单号</span>
                    <span class="info-value">{{ order.order_id }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">下单时间</span>
                    <span class="info-value">{{ order.created_at }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">订单状态</span>
                    <span class="info-value status-highlight">{{ order.status }}</span>
                </div>
            </div>

            <!-- 菜品明细 -->
            <div class="items-title">菜品清单</div>
            <div class="items-list">
                {% for item in order['items'] %}
                <div class="item-row">
                    <div>
                        <div class="item-name">{{ item.name }}</div>
                        <div class="item-meta">{{ item.price }} × {{ item.quantity }}</div>
                    </div>
                    <div class="item-price-total">{{ item.item_total }}</div>
                </div>
                {% endfor %}
            </div>

            <!-- 合计 -->
            <div class="summary-section">
                <span>合计：</span>
                <span class="total-price">{{ order.total }}</span>
            </div>
        </div>
    </div>
</body>

</html>
