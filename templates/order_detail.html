<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/order_detail.css') }}">
</head>

<body>
    <div class="page">
        <div class="header">
            <h1>订单详情</h1>
            <a class="back-link" href="/orders">返回订单列表</a>
        </div>

        <div class="detail-card">
            <!-- 订单基本信息 -->
            <div class="info-section">
                <div class="info-row">
                    <span class="info-label">订单号</span>
                    <span class="info-value">{{ order.order_id }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">下单时间</span>
                    <span class="info-value">{{ order.created_at }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">订单状态</span>
                    <span class="info-value status-highlight">{{ order.status }}</span>
                </div>
            </div>

            <!-- 菜品明细 -->
            <div class="items-title">菜品清单</div>
            <div class="items-list">
                {% for item in order['items'] %}
                <div class="item-row">
                    <div>
                        <div class="item-name">{{ item.name }}</div>
                        <div class="item-meta">{{ item.price }} × {{ item.quantity }}</div>
                    </div>
                    <div class="item-price-total">{{ item.item_total }}</div>
                </div>
                {% endfor %}
            </div>

            <!-- 合计 -->
            <div class="summary-section">
                <span>合计：</span>
                <span class="total-price">{{ order.total }}</span>
            </div>
        </div>
    </div>
</body>

</html>
